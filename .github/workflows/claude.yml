name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          additional_permissions: |
            actions: read
          # Do NOT set `prompt:` here -- an empty prompt lets the action feed
          # Claude the issue/PR context so it implements the task. Setting
          # `prompt:` replaces that task entirely. The auto-open-PR guidance
          # goes in --append-system-prompt so it augments, not replaces, the task.
          claude_args: >-
            --allowed-tools "Bash(npm:*),Bash(npx:*),Bash(gh pr *),Bash(git:*)"
            --append-system-prompt "When triggered from an issue, after pushing your work to the branch, open a pull request automatically instead of only posting a Create-a-PR link: run 'gh pr create --base main --head <branch> --title <concise title> --body <summary, and Closes #<issue-number>>'. If a PR already exists for that branch, push to it instead of creating a duplicate. Include the created PR URL in your issue comment."